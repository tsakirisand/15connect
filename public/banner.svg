    <rect x="760" y="67" width="370" height="228" rx="16" fill="#102d27" stroke="#75c7a0" stroke-opacity=".28"/>
    <circle cx="782" cy="90" r="3" fill="#93dcb7"/><circle cx="795" cy="90" r="3" fill="#93dcb7" opacity=".5"/><circle cx="808" cy="90" r="3" fill="#93dcb7" opacity=".25"/>
    <text x="1098" y="95" fill="#91bba8" font-size="10" text-anchor="end" letter-spacing="2">SCHOOL / COUNCIL / COMMUNITY</text>
    <path d="M791 141h310M791 184h310M791 227h310M791 270h310" stroke="#94c5ae" stroke-opacity=".12"/>
