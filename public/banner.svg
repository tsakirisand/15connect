<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">15Connect</title>
  <desc id="desc">Connect your school community. A digital space for Greek student councils.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102d27"/><stop offset="1" stop-color="#1d5445"/></linearGradient>
    <linearGradient id="bar" x2="0" y2="1"><stop stop-color="#96e6bc"/><stop offset="1" stop-color="#40ac87"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#b5eed3" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="1100" cy="20" r="270" fill="#9be7c3" opacity=".035"/>
  <g font-family="Arial, Helvetica, sans-serif">
