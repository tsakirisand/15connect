<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">15Connect — Your school, in sync</title>
  <desc id="desc">A home for Greek student councils to share announcements, organize events, and hear student ideas.</desc>
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101d3a"/><stop offset="1" stop-color="#273b70"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#80e4ce"/><stop offset="1" stop-color="#64a8ff"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f2f6ff"/></linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" opacity=".12"/></pattern>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#backdrop)"/>
  <rect width="1200" height="420" rx="28" fill="url(#dots)"/>
  <circle cx="1115" cy="24" r="260" fill="#83c9ff" opacity=".08"/>
  <circle cx="1060" cy="400" r="210" fill="#65e0c3" opacity=".07"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="64" y="54" width="42" height="42" rx="13" fill="url(#glow)"/>
    <path d="M75 67h19v13H83l-5 4v-4h-3z" fill="none" stroke="#102447" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="81" cy="73.5" r="1.3" fill="#102447"/><circle cx="85" cy="73.5" r="1.3" fill="#102447"/><circle cx="89" cy="73.5" r="1.3" fill="#102447"/>
    <text x="119" y="82" fill="#e8f4ff" font-size="20" font-weight="700">15Connect</text>
    <text x="64" y="162" fill="#8de7d0" font-size="13" font-weight="700" letter-spacing="2.6">THE SCHOOL COUNCIL, CONNECTED</text>
    <text x="60" y="226" fill="#ffffff" font-size="54" font-weight="700" letter-spacing="-1.8">Your school,</text>
    <text x="60" y="286" fill="#ffffff" font-size="54" font-weight="700" letter-spacing="-1.8">in sync.</text>
    <text x="64" y="329" fill="#c3d1ed" font-size="18">One place for council updates, school events,</text>
    <text x="64" y="355" fill="#c3d1ed" font-size="18">and ideas from every student.</text>
    <g font-size="11" font-weight="700" letter-spacing="1.2">
      <rect x="64" y="374" width="132" height="28" rx="14" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".18"/>
      <circle cx="81" cy="388" r="4" fill="#8de7d0"/><text x="93" y="392" fill="#eaf4ff">ANNOUNCEMENTS</text>
      <rect x="206" y="374" width="78" height="28" rx="14" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".18"/>
      <circle cx="222" cy="388" r="4" fill="#8de7d0"/><text x="234" y="392" fill="#eaf4ff">EVENTS</text>
      <rect x="294" y="374" width="126" height="28" rx="14" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".18"/>
      <circle cx="310" cy="388" r="4" fill="#8de7d0"/><text x="322" y="392" fill="#eaf4ff">STUDENT IDEAS</text>

    <!-- App preview: council announcement, upcoming event, and ideas -->
    <rect x="650" y="44" width="486" height="332" rx="24" fill="#0c1730" opacity=".42"/>
    <rect x="660" y="36" width="466" height="332" rx="22" fill="url(#card)"/>
    <path d="M682 36h422a22 22 0 0 1 22 22v35H660V58a22 22 0 0 1 22-22" fill="#ffffff"/>
    <circle cx="684" cy="66" r="5" fill="#ff8b9b"/><circle cx="702" cy="66" r="5" fill="#ffc86b"/><circle cx="720" cy="66" r="5" fill="#69d6b2"/>
    <rect x="762" y="53" width="232" height="26" rx="13" fill="#f2f5fb"/>
    <circle cx="779" cy="66" r="4" fill="#9aa9c4"/><rect x="790" y="63" width="128" height="5" rx="2.5" fill="#cad3e3"/>
    <rect x="680" y="112" width="54" height="54" rx="17" fill="#e5f7f2"/>
    <path d="M696 126h23v19h-14l-7 6v-6h-2z" fill="none" stroke="#2a9b83" stroke-width="2" stroke-linejoin="round"/>
    <text x="748" y="128" fill="#71809d" font-size="10" font-weight="700" letter-spacing="1.4">SCHOOL ANNOUNCEMENT</text>
    <text x="748" y="150" fill="#192747" font-size="18" font-weight="700">Welcome to your school hub</text>
    <rect x="748" y="158" width="236" height="6" rx="3" fill="#dce3ef"/>
    <rect x="748" y="170" width="186" height="6" rx="3" fill="#e7ebf3"/>
    <rect x="680" y="195" width="205" height="143" rx="16" fill="#eef3ff"/>
    <rect x="696" y="211" width="30" height="30" rx="9" fill="#dbe5ff"/>
    <path d="M704 216v18m14-18v18M700 221h22m-22 8h22" stroke="#5475d1" stroke-width="1.6" stroke-linecap="round"/>
    <text x="736" y="221" fill="#657493" font-size="9" font-weight="700" letter-spacing="1">UP NEXT</text>
    <text x="696" y="267" fill="#1b2b50" font-size="17" font-weight="700">School Assembly</text>
    <text x="696" y="289" fill="#657493" font-size="12">Friday · 10:00 AM</text>
    <rect x="696" y="308" width="88" height="18" rx="9" fill="#dce6ff"/>
    <text x="708" y="321" fill="#4f69b7" font-size="9" font-weight="700" letter-spacing=".7">VIEW EVENT</text>
    <rect x="901" y="195" width="205" height="143" rx="16" fill="#eaf8f4"/>
    <circle cx="925" cy="224" r="15" fill="#d2f0e7"/>
    <path d="M919 224h12m-6-6v12" stroke="#259578" stroke-width="2" stroke-linecap="round"/>
    <text x="950" y="221" fill="#657493" font-size="9" font-weight="700" letter-spacing="1">STUDENT IDEAS</text>
    <text x="917" y="263" fill="#1b2b50" font-size="16" font-weight="700">Make our school</text>
    <text x="917" y="283" fill="#1b2b50" font-size="16" font-weight="700">greener 🌱</text>
    <rect x="917" y="302" width="67" height="20" rx="10" fill="#d2f0e7"/>
    <text x="928" y="316" fill="#25856f" font-size="9" font-weight="700">UNDER REVIEW</text>
  </g>
</svg>
