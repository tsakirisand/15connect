      <text x="310" y="272" fill="#d9f4e5">EVENTS</text>
      <path d="M376 267h24m-6-5 6 5-6 5" fill="none" stroke="#8ac9ac" stroke-width="1.5"/>
      <rect x="414" y="249" width="116" height="36" rx="18" fill="#9de1be"/>
      <text x="472" y="272" fill="#143c30">STUDENT IDEAS</text>
