    <text x="60" y="148" fill="#f5fff9" font-size="58" font-weight="700" letter-spacing="-2">15Connect</text>
    <text x="64" y="195" fill="#c0d8ce" font-size="22">Bring your student council community together.</text>
    <g font-size="12" font-weight="700" letter-spacing="1.2" text-anchor="middle">
